name: Release
run-name: Release ${{ inputs.version }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must be 2.2.x, e.g. 2.2.10)'
        required: true
        type: string

permissions:
  contents: write  # push the release commit and tag, create the release
  id-token: write  # npm provenance (OIDC)

env:
  ASCIIDOCTOR_CORE_VERSION: v2.0.23
  VERSION: ${{ inputs.version }}

jobs:
  tag:
    name: Bump version and tag
    if: github.ref_name == 'v2.2.x' && github.repository_owner == 'asciidoctor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      # tasks/version.js rejects any version outside of the 2.2.x line
      - name: Bump version and update changelog
        run: |
          node tasks/version.js "$VERSION"
          node tasks/changelog.js release "$VERSION"
      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -a -m "$VERSION"
          git tag "v$VERSION" -m "$VERSION"
          git push origin "${{ github.ref_name }}" "v$VERSION"

  build:
    needs: tag
    uses: ./.github/workflows/build.yml
    with:
      ref: v${{ inputs.version }}

  publish:
    name: Publish to npmjs
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
      # npm >= 11.5.1 (bundled with Node 24) is required to publish using trusted publishing (OIDC)
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      # libgbm-dev is required by Puppeteer 3+ (the dist task runs the browser tests)
      - name: Install system dependencies
        run: sudo apt-get install -y libgbm-dev
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix packages/core
      - name: Package
        run: ./scripts/package.sh
      - name: Publish
        run: node tasks/publish.js
      # the registry can take several minutes to expose a freshly published version
      - name: Make sure that the packages have been published on npmjs
        timeout-minutes: 15
        run: ./scripts/wait-packages-published.sh
      - name: Upload distribution archives
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            packages/core/bin/asciidoctor.js.dist.zip
            packages/core/bin/asciidoctor.js.dist.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Generate release notes
        run: node tasks/changelog.js notes "$VERSION" > RELEASE_NOTES.md
      # @asciidoctor/core must be published to npmjs before we can produce the binaries
      - name: Produce binaries
        run: ./scripts/binaries.sh
      - name: Download distribution archives
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: packages/core/bin
      # A release from a maintenance branch must not steal the "Latest" badge
      # from the release of the current line (gh marks the newest release as
      # latest by default).
      - name: Create release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" \
            --verify-tag \
            --title "v$VERSION" \
            --notes-file RELEASE_NOTES.md \
            --latest=false \
            packages/core/bin/asciidoctor.js.dist.zip \
            packages/core/bin/asciidoctor.js.dist.tar.gz \
            packages/asciidoctor/dist/asciidoctor-linux \
            packages/asciidoctor/dist/asciidoctor-macos \
            packages/asciidoctor/dist/asciidoctor-win.exe
      - name: Announcement
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          email: ${{ secrets.ZULIP_USERNAME }}
          api-key: ${{ secrets.ZULIP_API_KEY }}
          organization-url: 'https://asciidoctor.zulipchat.com'
          to: '279652'
          type: 'stream'
          topic: 'releases'
          content: |
            Asciidoctor.js v${{ inputs.version }} is out!

            https://github.com/asciidoctor/asciidoctor.js/releases/tag/v${{ inputs.version }}
