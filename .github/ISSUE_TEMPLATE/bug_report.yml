name: Bug report
description: Create a report to help us improve
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        If you've arrived here to ask a question about how to use Asciidoctor or the AsciiDoc syntax, please direct your question to the #users/asciidoctor.js stream in the [project chat](https://chat.asciidoctor.org) instead.
        You can learn more about the project support policy on the following page: https://docs.asciidoctor.org/about/support/
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I've verified that I'm using the latest patch release and retested my scenario.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior. If possible, include a minimal AsciiDoc document and the code used to convert it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. Ubuntu, Windows
    validations:
      required: true
  - type: input
    id: js-engine
    attributes:
      label: JavaScript engine
      placeholder: e.g. Chrome, Node 24.14.0
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Asciidoctor.js version
      placeholder: e.g. 3.2.1
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
